<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/consultamesa.css">
  <link rel="stylesheet" href="../css/variables.css">
</head>
<body>
  <section class="consulta-cuenta">
    <h2>Consulta de Cuenta</h2>
    <form id="form-consulta">
      <label for="mesa">Número de Mesa:</label>
      <input type="number" id="mesa" name="mesa" min="1" max="8" required>
      <button type="submit" class="btn btn-naranja">Consultar</button>
    </form>
  
    <!-- Resultado de la consulta -->
    <div id="resultado-cuenta" class="resultado-cuenta oculto">
      <h3>Cuenta - Mesa <span id="mesa-numero"></span></h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="detalle-cuenta">
          <!-- Aquí se insertan los productos -->
        </tbody>
      </table>
      <p><strong>Total a pagar:</strong> <span id="total-cuenta"></span></p>
      <button class="btn btn-verde">Cerrar cuenta</button>
    </div>
  </section>
</body>
</html>
