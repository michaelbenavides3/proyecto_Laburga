<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Usuario</title>
  <link rel="stylesheet" href="../css/crear-usuario.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <h1>Gestión de Usuarios - Panel Administrador</h1>
  </header>

  <!-- Layout principal -->
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Panel Menú Administrador</h2>
      <nav>
        <a href="crear-usuario.html" class="btn">Crear Usuario</a>
        <a href="listar-usuarios.html" class="btn">Listar Usuarios</a>
        <a href="roles.html" class="btn">Gestionar Roles</a>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="contenido">
      <h2>Crear Nuevo Usuario</h2>

      <form id="form-usuario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo<!--/ Usuario-->:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>

        <label for="rol">Rol:</label>
        <select id="rol" name="rol" required>
          <option value="">Seleccione...</option>
          <option value="administrador">Administrador</option>
          <option value="cajero">Cajero</option>
          <option value="mesero">Mesero</option>
        </select>

        <button type="submit" class="btn btn--crear">Crear Usuario</button>
      </form>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Labur-Ga. Todos los derechos reservados.</p>
  </footer>

  <!-- Script -->
  <script src="../js/admin.js"></script>
</body>

</html>
